name: Build MAINTAIN AI Local Intelligence

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Verify desktop entrypoint imports
        run: python -c "import desktop; from app.main import app; print('Desktop/API import OK')"

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify packaging inputs
        shell: pwsh
        run: |
          if (-not (Test-Path "desktop.py")) { throw "desktop.py is missing from repository root." }
          if (-not (Test-Path "packaging\maintain_ai_local.spec")) { throw "PyInstaller spec is missing." }
          if (-not (Test-Path "packaging\installer.iss")) { throw "Inno Setup script is missing." }

      - name: Verify SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_APP_POLICY_SLUG: ${{ vars.SIGNPATH_APP_POLICY_SLUG }}
          SIGNPATH_INSTALLER_POLICY_SLUG: ${{ vars.SIGNPATH_INSTALLER_POLICY_SLUG }}
          SIGNPATH_APP_ARTIFACT_CONFIG_SLUG: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIG_SLUG }}
          SIGNPATH_INSTALLER_ARTIFACT_CONFIG_SLUG: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIG_SLUG }}
        run: |
          $required = @{
            "SIGNPATH_API_TOKEN" = $env:SIGNPATH_API_TOKEN
            "SIGNPATH_ORGANIZATION_ID" = $env:SIGNPATH_ORGANIZATION_ID
            "SIGNPATH_PROJECT_SLUG" = $env:SIGNPATH_PROJECT_SLUG
            "SIGNPATH_APP_POLICY_SLUG" = $env:SIGNPATH_APP_POLICY_SLUG
            "SIGNPATH_INSTALLER_POLICY_SLUG" = $env:SIGNPATH_INSTALLER_POLICY_SLUG
            "SIGNPATH_APP_ARTIFACT_CONFIG_SLUG" = $env:SIGNPATH_APP_ARTIFACT_CONFIG_SLUG
            "SIGNPATH_INSTALLER_ARTIFACT_CONFIG_SLUG" = $env:SIGNPATH_INSTALLER_ARTIFACT_CONFIG_SLUG
          }
          $missing = @($required.GetEnumerator() | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) } | ForEach-Object { $_.Key })
          if ($missing.Count -gt 0) {
            throw "SignPath is not configured. Add repository secret SIGNPATH_API_TOKEN and repository variables: $($missing -join ', '). See docs/SIGNING.md."
          }

      - name: Build executable
        run: pyinstaller packaging/maintain_ai_local.spec --noconfirm --clean --log-level WARN

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\MAINTAIN-AI-Local-Intelligence.exe")) {
            throw "PyInstaller did not produce the expected executable."
          }

      # The application executable is signed before it is placed in the installer.
      # This is important because signing only the outer installer does not make the
      # installed application itself a trusted Authenticode binary.
      - name: Upload unsigned application for signing
        id: upload-app-for-signing
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-local-intelligence-app-to-sign
          path: dist/MAINTAIN-AI-Local-Intelligence.exe
          if-no-files-found: error
          retention-days: 1

      - name: Submit application signing request
        id: sign-app
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_APP_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-app-for-signing.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed-app

      - name: Replace executable with signed executable
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path "dist\signed-app" -Filter "MAINTAIN-AI-Local-Intelligence.exe" -Recurse | Select-Object -First 1
          if (-not $signed) { throw "SignPath returned no signed MAINTAIN-AI-Local-Intelligence.exe." }
          Copy-Item $signed.FullName "dist\MAINTAIN-AI-Local-Intelligence.exe" -Force
          $sig = Get-AuthenticodeSignature "dist\MAINTAIN-AI-Local-Intelligence.exe"
          if ($sig.Status -ne "Valid") { throw "Signed application Authenticode status is '$($sig.Status)', expected Valid." }
          Write-Host "Signed application certificate: $($sig.SignerCertificate.Subject)"

      - name: Smoke test signed executable
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\MAINTAIN-AI-Local-Intelligence.exe" -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            throw "Signed desktop application exited during startup. ExitCode=$($proc.ExitCode)"
          }
          Stop-Process -Id $proc.Id -Force

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\installer\MAINTAIN-AI-Local-Intelligence-Setup.exe")) {
            throw "Inno Setup did not produce the expected installer."
          }

      - name: Upload unsigned installer for signing
        id: upload-installer-for-signing
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-local-intelligence-installer-to-sign
          path: dist/installer/MAINTAIN-AI-Local-Intelligence-Setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Submit installer signing request
        id: sign-installer
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_INSTALLER_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-installer-for-signing.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed-installer

      - name: Replace installer with signed installer
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path "dist\signed-installer" -Filter "MAINTAIN-AI-Local-Intelligence-Setup.exe" -Recurse | Select-Object -First 1
          if (-not $signed) { throw "SignPath returned no signed installer." }
          Copy-Item $signed.FullName "dist\installer\MAINTAIN-AI-Local-Intelligence-Setup.exe" -Force
          $sig = Get-AuthenticodeSignature "dist\installer\MAINTAIN-AI-Local-Intelligence-Setup.exe"
          if ($sig.Status -ne "Valid") { throw "Signed installer Authenticode status is '$($sig.Status)', expected Valid." }
          Write-Host "Signed installer certificate: $($sig.SignerCertificate.Subject)"

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = @(
            "dist\MAINTAIN-AI-Local-Intelligence.exe",
            "dist\installer\MAINTAIN-AI-Local-Intelligence-Setup.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content "dist\SHA256SUMS.txt" -Encoding utf8
          Get-Content "dist\SHA256SUMS.txt"

      - name: Upload signed Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-local-intelligence-executable-signed
          path: dist/MAINTAIN-AI-Local-Intelligence.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-local-intelligence-installer-signed
          path: dist/installer/MAINTAIN-AI-Local-Intelligence-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload SHA-256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-local-intelligence-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
