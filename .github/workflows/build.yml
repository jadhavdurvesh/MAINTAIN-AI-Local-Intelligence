name: Build MAINTAIN AI Local Intelligence

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build executable
        run: pyinstaller packaging/maintain_ai_local.spec --noconfirm
      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\installer | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\installer.iss
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-local-intelligence-executable
          path: dist/MAINTAIN-AI-Local-Intelligence.exe
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: maintain-ai-local-intelligence-installer
          path: dist/installer/MAINTAIN-AI-Local-Intelligence-Setup.exe
